memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  retrieval_top_k: 8
  min_turns_before_store: 5  # Extract facts once per N completed turns.
  max_chars_before_store: 2000  # Extract early when pending dialogue exceeds this many characters.
  store_queue_maxsize: 100
  reflect_interval_seconds: 3600  # Check for new facts and reflect at most once per hour.
  recall_budget: mid
  enable_entity_extraction: true
  llm_timeout: 120
  provider: ''
  nudge_interval: 10
  flush_min_turns: 6
embedding:
  enabled: true
  provider: openai
  model: embedding-3
  base_url: https://api.z.ai/api/paas/v4
  api_key: ${GLM_API_KEY}
  api_key_env: GLM_API_KEY
  dimensions: 2048
  normalize: true
